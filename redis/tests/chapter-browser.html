<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Redis chapter transition verification</title>
<style>body{font:15px/1.5 system-ui;margin:20px;color:#333}iframe{display:block;border:1px solid #ddd;height:844px}pre{white-space:pre-wrap}</style>
<h1>Redis chapter transition verification</h1>
<p id="summary" data-testid="summary" data-status="running">Running…</p>
<iframe title="Redis player under test"></iframe><pre id="results" data-testid="results"></pre>
<script type="module">
import {chapters} from '../content.js';
const frame=document.querySelector('iframe'),summary=document.querySelector('#summary'),results=document.querySelector('#results');
const report={cards:0,scenes:0,departureChecks:0,historyChecks:0,keyboardChecks:0,failures:[]};
const raf=()=>new Promise(resolve=>requestAnimationFrame(resolve));
const check=(condition,message)=>{if(!condition)throw new Error(message);};
async function settle(doc){
  for(const animation of doc.getAnimations())animation.finish();
  await Promise.resolve();await raf();
  check(!doc.querySelector('#next').disabled,'Continue did not unlock after all finite animations finished');
  check(!doc.querySelector('.chapter-departure'),'Outgoing screen was not removed');
}
async function sample(doc,time){
  for(const animation of doc.getAnimations()){animation.pause();animation.currentTime=time;}
  await raf();
}
function visibleOpacity(node){return Number(frame.contentWindow.getComputedStyle(node).opacity);}
function inspectCard(doc,chapter,lang){
  check(doc.querySelector('#player').dataset.view==='chapter',chapter.id+': missing title screen');
  check(doc.querySelector('#chapterTitle').textContent===chapter.title[lang],chapter.id+': incorrect translated title');
  check(!doc.querySelector('#chapterIntro').hidden,chapter.id+': title screen hidden');
  check(doc.querySelector('#narrative').hidden,chapter.id+': caption leaks onto title screen');
  check(doc.querySelector('#scene').hidden&&!doc.querySelector('#scene svg'),chapter.id+': diagram leaks onto title screen');
  check(doc.querySelector('#chapterIntro').contains(doc.querySelector('#next')),chapter.id+': controls are not under title');
  check(doc.querySelectorAll('#next').length===1,chapter.id+': duplicate controls');
  report.cards++;
}
try{
  for(const lang of ['ru','en'])for(const width of [960,390]){
    frame.style.width=width+'px';
    const loaded=new Promise(resolve=>frame.onload=resolve);
    frame.src='../?lang='+lang+'&check='+width+'#first-key';await loaded;
    const doc=frame.contentDocument;
    for(let attempt=0;attempt<90&&!doc.querySelector('#chapterTitle').textContent;attempt++)await raf();
    for(const [index,chapter] of chapters.entries()){
      inspectCard(doc,chapter,lang);
      const animated=doc.getAnimations().length>0;
      if(animated){
        check(doc.querySelector('#next').disabled,chapter.id+': navigation unlocked during title animation');
        await sample(doc,100);
        check(visibleOpacity(doc.querySelector('#chapterTitle'))===0,chapter.id+': title appears before white pause');
        await settle(doc);
      }
      const titleBox=doc.querySelector('#chapterTitle').getBoundingClientRect();
      check(titleBox.left>=0&&titleBox.right<=width,chapter.id+': title clips at '+width+'px');
      doc.querySelector('#next').focus();doc.querySelector('#next').click();
      check(doc.querySelector('#player').dataset.view==='scene',chapter.id+': Continue skipped first scene');
      check(doc.querySelector('#explanation').textContent===chapter.steps[0].body[lang],chapter.id+': wrong first caption');
      check(doc.activeElement===doc.querySelector('#explanation'),chapter.id+': focus was lost when controls moved');
      if(animated){
        check(doc.querySelector('#next').disabled,chapter.id+': scene unlocked during title exit');
        await sample(doc,300);
        check(visibleOpacity(doc.querySelector('#scene'))===0,chapter.id+': first objects appear before title leaves');
        const ghost=doc.querySelector('.chapter-departure');
        check(ghost&&ghost.inert&&ghost.getAttribute('aria-hidden')==='true',chapter.id+': outgoing title is not inert');
        check(ghost.querySelectorAll('[id]').length===0,chapter.id+': outgoing title duplicates IDs');
        report.departureChecks++;
        await sample(doc,750);
        check(visibleOpacity(doc.querySelector('#scene'))===0,chapter.id+': missing white pause after title');
        check(visibleOpacity(ghost)===0,chapter.id+': old title remains during white pause');
        await settle(doc);
      }
      check(doc.querySelector('#narrative').contains(doc.querySelector('#next')),chapter.id+': scene controls remain at title');
      report.scenes++;
      if(index===0){
        doc.activeElement.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}));
        check(doc.querySelector('#player').dataset.view==='chapter','Left arrow did not return to title');
        check(doc.activeElement===doc.querySelector('#chapterTitle'),'Keyboard focus did not follow the title');
        await settle(doc);
        doc.activeElement.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));
        check(doc.querySelector('#player').dataset.view==='scene','Right arrow skipped first scene');
        await settle(doc);report.keyboardChecks++;
      }
      if(index===1){
        const changeHistory=direction=>new Promise(resolve=>{
          frame.contentWindow.addEventListener('popstate',resolve,{once:true});
          frame.contentWindow.history[direction]();
        });
        await changeHistory('back');await raf();await settle(doc);
        check(doc.querySelector('#explanation').textContent===chapters[index-1].steps.at(-1).body[lang],'Back did not restore previous chapter’s final scene');
        await changeHistory('forward');await raf();await settle(doc);
        check(doc.querySelector('#explanation').textContent===chapter.steps[0].body[lang],'Forward skipped the first scene');
        report.historyChecks++;
      }
      for(const step of chapter.steps.slice(1)){
        doc.querySelector('#next').click();
        check(doc.querySelector('#player').dataset.view==='scene',chapter.id+': title interrupts steps inside a chapter');
        check(doc.querySelector('#explanation').textContent===step.body[lang],chapter.id+': a scene was skipped or repeated');
        await settle(doc);report.scenes++;
      }
      if(index<chapters.length-1)doc.querySelector('#next').click();
    }
  }
  summary.dataset.status='pass';summary.textContent='PASS';
}catch(error){report.failures.push(String(error.stack||error));summary.dataset.status='fail';summary.textContent='FAIL';}
results.textContent=JSON.stringify(report,null,2);
</script>
</html>
