<!doctype html><html lang="en"><meta charset="utf-8"><title>Postgres scene verification</title>
<style>body{font:15px system-ui;margin:24px;color:#333}#host{width:1040px;max-width:100%}svg{width:100%;overflow:visible}pre{white-space:pre-wrap}#controls{display:inline-flex}</style>
<h1>Postgres scene verification</h1><p id="summary">Starting…</p><div id="host"></div><p id="caption"></p><div id="controls"><button>Replay</button><button>Continue</button></div><pre id="results"></pre>
<script type="module">
import {chapters} from '../content.js';
import {storyScene} from '../scenes.js';
import {sceneAnimations} from '../motion.js';
import {choreography} from '../choreography.js';
const host=document.querySelector('#host'),caption=document.querySelector('#caption'),controls=document.querySelector('#controls');
const report={scenes:0,texts:0,flows:0,animatedScenes:0,failures:[]};
const fail=(kind,c,s,lang,compact,extra)=>{if(report.failures.length<120)report.failures.push({kind,chapter:c.id,step:s,lang,compact,...extra});};
const frame=()=>new Promise(resolve=>requestAnimationFrame(resolve));
function bounds(el){return el.getBBox();}
for(const c of chapters)for(let s=0;s<c.steps.length;s++)for(const compact of [false,true])for(const lang of ['ru','en']){
  host.style.width=compact?'390px':'1040px';host.innerHTML=storyScene(c.id,s,lang,compact);const svg=host.querySelector('svg'),view=svg.viewBox.baseVal;
  report.scenes++;
  for(const el of svg.querySelectorAll('text')){
    const b=bounds(el),m=svg.getCTM().inverse().multiply(el.getCTM()),corners=[new DOMPoint(b.x,b.y),new DOMPoint(b.x+b.width,b.y+b.height)].map(p=>p.matrixTransform(m));report.texts++;
    if(corners.some(p=>p.x< -2||p.x>view.width+2||p.y< -2||p.y>view.height+2))fail('text outside canvas',c,s,lang,compact,{text:el.textContent});
    const actor=el.closest('[data-actor]');
    if(actor&&!actor.querySelector(':scope > circle')){
      const rect=actor.querySelector(':scope > rect');if(rect){const local=bounds(rect),relative=el.getCTM().multiply(actor.getCTM().inverse());/* text and its frame share local actor coordinates */
        if(b.x<local.x-2||b.x+b.width>local.x+local.width+2||b.y<local.y-2||b.y+b.height>local.y+local.height+2)fail('text outside actor',c,s,lang,compact,{text:el.textContent});
      }
    }
  }
  for(const flow of svg.querySelectorAll('.flow')){
    const path=flow.querySelector('path'),length=path.getTotalLength();report.flows++;
    for(const [key,at]of [[flow.dataset.from,0],[flow.dataset.to,length]]){
      const actor=svg.querySelector(`[data-actor="${CSS.escape(key)}"]`),shape=actor?.querySelector(':scope > circle,:scope > rect');
      if(!shape){fail('missing endpoint shape',c,s,lang,compact,{key});continue;}
      const point=path.getPointAtLength(at).matrixTransform(path.getCTM()).matrixTransform(shape.getCTM().inverse());
      let distance;
      if(shape.tagName==='circle')distance=Math.abs(Math.hypot(point.x-shape.cx.baseVal.value,point.y-shape.cy.baseVal.value)-shape.r.baseVal.value);
      else{const r=bounds(shape);distance=Math.hypot(Math.max(r.x-point.x,0,point.x-r.x-r.width),Math.max(r.y-point.y,0,point.y-r.y-r.height));}
      if(distance>8)fail('route misses endpoint',c,s,lang,compact,{key,distance});
    }
  }
  if(report.scenes%40===0){document.querySelector('#summary').textContent=`Checking ${report.scenes} scenes…`;await frame();}
}
for(const c of chapters){
  const s=Math.min(1,c.steps.length-1);host.innerHTML=storyScene(c.id,s,'ru',false);
  const timeline=sceneAnimations({host,previousMarkup:storyScene(c.id,s-1,'ru',false),caption,controls,score:choreography(c.id,s)});
  for(const animation of timeline.animations){animation.pause();animation.currentTime=timeline.duration;}
  await frame();
  if(getComputedStyle(controls).opacity!=='1')fail('controls do not settle',c,s,'ru',false,{});
  for(const animation of timeline.animations)animation.cancel();report.animatedScenes++;
}
const status=report.failures.length?'failed':'passed';document.querySelector('#summary').dataset.status=status;document.querySelector('#summary').textContent=`${status}: ${report.scenes} scene variants, ${report.texts} texts, ${report.flows} routes, ${report.animatedScenes} animated transitions, ${report.failures.length} failures`;
document.querySelector('#results').textContent=JSON.stringify(report,null,2);
</script></html>
